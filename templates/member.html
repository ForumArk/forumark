{% extends "base.html" %}
{% block title %}{{ member.name }} · {{ site.title }}{% endblock %}
{% block main %}
<h1>{{ member.name }}</h1>
<p class="summary">{{ member.posts }} archived posts in {{ threads|length }} threads</p>
<ul class="thread-list-simple">{% for t in threads %}<li><a href="{{ t.href }}">{{ t.title }}</a> <span class="count">{{ t.posts }} posts</span></li>{% endfor %}</ul>
{% endblock %}
