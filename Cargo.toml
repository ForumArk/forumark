[package]
name = "forumark"
version = "0.4.0"
license = "MIT"
edition = "2024"

[dependencies]
ammonia = "4.2.5"
anyhow = "1.0.104"
chrono = "0.4.45"
encoding_rs = "0.8.44"
clap = { version = "4.6.8", features = ["derive"] }
flate2 = "1.1.11"
minijinja = { version = "3.1.0", features = ["serde"] }
pagefind = "1.6.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "gzip"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29.0"
serde_json = "1"
serde = { version = "1.0.229", features = ["derive"] }
url = "2.5.8"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
tempfile = "3.27.0"
