# Builds the program for Windows, macOS and Linux and attaches the downloads to a
# GitHub release. Runs when a version tag like v0.1.0 is pushed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            bin: forumark
          - os: windows-latest
            name: windows-x86_64
            bin: forumark.exe
          - os: macos-latest
            name: macos-arm64
            bin: forumark
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir pkg
          cp "target/release/${{ matrix.bin }}" README.md LICENSE pkg/
          cd pkg
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "../forumark-${{ matrix.name }}.zip" .
          else
            tar czf "../forumark-${{ matrix.name }}.tar.gz" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: forumark-${{ matrix.name }}
          path: forumark-${{ matrix.name }}.*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: forumark-*
          generate_release_notes: true
